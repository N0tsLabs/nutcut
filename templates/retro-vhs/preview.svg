<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="复古录像带模板预览">
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24103c"/><stop offset=".55" stop-color="#1b0b2e"/><stop offset="1" stop-color="#120721"/>
    </linearGradient>
    <radialGradient id="vglow" cx=".2" cy=".2" r=".7">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity=".2"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vglow2" cx=".85" cy=".8" r=".7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="vscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#f5e9ff" stroke-opacity=".12"/>
    </pattern>
    <filter id="vblur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#vbg)"/>
  <rect width="1920" height="1080" fill="url(#vglow)"/>
  <rect width="1920" height="1080" fill="url(#vglow2)"/>

  <g font-family="Consolas, monospace" font-size="14" font-weight="700" letter-spacing="4" fill="#f5e9ff">
    <circle cx="128" cy="84" r="7" fill="#ff4fd8"/>
    <text x="150" y="90">REC</text>
    <text x="1790" y="90" text-anchor="end" opacity=".7">SP · 1987</text>
    <text x="128" y="1010" opacity=".6">1987.08.14</text>
    <text x="1790" y="1010" text-anchor="end" opacity=".6">00:00:00</text>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="112" y="330" font-size="15" font-family="Consolas, monospace" font-weight="700" letter-spacing="5" fill="#ff9be8">按下播放键，画面开始滚动。</text>
    <text x="104" y="500" font-size="138" font-weight="900" letter-spacing="-5" fill="#22d3ee" opacity=".5" transform="translate(6 0)">倒带，回到那年</text>
    <text x="104" y="500" font-size="138" font-weight="900" letter-spacing="-5" fill="#ff4fd8" opacity=".5" transform="translate(-6 0)">倒带，回到那年</text>
    <text x="104" y="500" font-size="138" font-weight="900" letter-spacing="-5" fill="#f5e9ff">倒带，回到那年</text>
    <text x="112" y="600" font-size="24" letter-spacing="8" fill="#c9a8e6">PLAY ▶ 1987 / SP</text>
  </g>

  <g transform="translate(1180 300)">
    <rect width="620" height="360" fill="#2a1240" stroke="#f5e9ff" stroke-opacity=".25"/>
    <rect x="14" y="14" width="592" height="332" fill="none" stroke="#ff4fd8" stroke-opacity=".2"/>
    <text x="320" y="188" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="62" font-weight="900" fill="#f5e9ff" opacity=".9">那年夏天</text>
    <text x="320" y="240" text-anchor="middle" font-family="Consolas, monospace" font-size="14" letter-spacing="6" fill="#22d3ee">TAPE 01 / SIDE A</text>
    <rect x="14" y="330" width="592" height="3" fill="#ff4fd8" opacity=".8"/>
  </g>

  <g transform="translate(150 760)">
    <rect width="1640" height="16" fill="#f5e9ff" fill-opacity=".1"/>
    <rect width="760" height="16" fill="#ff4fd8"/>
    <text x="0" y="54" font-family="Consolas, monospace" font-size="12" letter-spacing="3" fill="#c9a8e6">TRACKING / 04 — SIGNAL LOSS</text>
  </g>

  <g font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#c9a8e6" opacity=".7">
    <text x="112" y="958">NUTCUT / TAPE</text>
    <text x="1808" y="958" text-anchor="end" fill="#22d3ee">01 / 06</text>
  </g>

  <rect width="1920" height="1080" fill="url(#vscan)"/>
  <g opacity=".5">
    <rect y="138" width="1920" height="4" fill="#f5e9ff" opacity=".08"/>
    <rect y="456" width="1920" height="7" fill="#22d3ee" opacity=".1"/>
    <rect y="782" width="1920" height="5" fill="#ff4fd8" opacity=".12"/>
  </g>
</svg>
