<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>视频双屏 · Video Split</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#0c0f13}body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;color:#fff}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0c0f13}
  .top{position:absolute;left:90px;right:90px;top:64px;z-index:5;display:flex;justify-content:space-between;font:800 14px/1 "Consolas",monospace;letter-spacing:.18em;color:rgba(255,255,255,.5)}.top b{color:#8fd0ff}
  .panels{position:absolute;left:90px;right:90px;top:140px;height:600px;display:grid;grid-template-columns:1fr 1fr;gap:14px;z-index:3}
  .panel{position:relative;border-radius:14px;overflow:hidden;border:3px solid rgba(255,255,255,.16);background:#222a35;display:grid;place-items:center;color:rgba(255,255,255,.38);font:800 14px/1 "Consolas",monospace;letter-spacing:.14em;transition:none}
  .panel::before{content:"";position:absolute;inset:18px;border:1px dashed rgba(255,255,255,.14);border-radius:8px}
  .panel.active{border-color:#8fd0ff;box-shadow:0 0 0 1px rgba(143,208,255,.4),0 24px 60px rgba(0,0,0,.3)}
  .caption{position:absolute;left:90px;right:90px;bottom:150px;z-index:5}
  .caption .k{font:800 13px/1 "Consolas",monospace;letter-spacing:.2em;color:#8fd0ff;margin-bottom:12px}.caption h1{font-size:64px;line-height:1.06;font-weight:900;letter-spacing:-.05em}.caption h1 em{font-style:normal;color:#8fd0ff}.caption p{margin-top:12px;font-size:22px;line-height:1.6;color:rgba(255,255,255,.6);max-width:1000px}
  .hud{position:absolute;left:90px;right:90px;bottom:56px;z-index:7;display:flex;align-items:center;gap:18px;font:800 12px/1 "Consolas",monospace;letter-spacing:.14em;color:rgba(255,255,255,.42)}.hud .bar{flex:1;height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}.hud .bar i{display:block;height:100%;width:0;background:#8fd0ff}
</style>
</head>
<body><div id="stage">
<div class="top"><span>VIDEO SPLIT / <b>01</b></span><span>DOUBLE SCREEN</span></div>
<div class="panels"><div class="panel active" id="left">视频占位 A</div><div class="panel" id="right">视频占位 B</div></div>
<div class="caption"><div class="k" id="kicker">SPLIT / 01</div><h1 id="title">左右两个<em>视角</em></h1><p id="text">两个画面同时说话时，观众会自己找关系。</p></div>
<div class="hud"><span id="idx">01 / 04</span><div class="bar"><i id="bar"></i></div><span>10 SEC</span></div>
</div><script>
(function(){var FPS=30,DUR=10,$=function(s){return document.querySelector(s)};var data=[['左右两个<em>视角</em>','两个画面同时说话时，观众会自己找关系。',0],['让一边<em>主</em>','另一边补充，不要平均用力。',1],['对比<em>动作</em>','同一动作、不同角度，剪起来最顺。',0],['最后<em>合上</em>','用一个共同元素把两边收在一起。',1]];
function clamp(v){return Math.max(0,Math.min(1,v))}function cubicBezier(x1,y1,x2,y2){var cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;function fx(t){return((ax*t+bx)*t+cx)*t}function dfx(t){return(3*ax*t+2*bx)*t+cx}function fy(t){return((ay*t+by)*t+cy)*t}return function(v){v=clamp(v);var t=v;for(var i=0;i<6;i++){var x=fx(t)-v;if(Math.abs(x)<1e-5)break;var d=dfx(t);if(Math.abs(d)<1e-5)break;t=clamp(t-x/d)}return fy(t)}}var ease=cubicBezier(.16,1,.3,1);function smooth(v){return ease(v)}
window.renderFrame=function(frame,inputs){var t=Math.max(0,frame/FPS),active=Math.min(3,Math.floor(t/2.5));$('#kicker').textContent='SPLIT / '+String(active+1).padStart(2,'0');$('#title').innerHTML=data[active][0];$('#text').textContent=data[active][1];$('#left').classList.toggle('active',data[active][2]===0);$('#right').classList.toggle('active',data[active][2]===1);var local=t-active*2.5,e=smooth(local/.5);$('#left').style.transform='scale('+(data[active][2]===0?1:0.97)+')';$('#right').style.transform='scale('+(data[active][2]===1?1:0.97)+')';$('.caption').style.opacity=e.toFixed(3);$('.caption').style.transform='translateY('+((1-e)*16).toFixed(1)+'px)';$('#idx').textContent=String(active+1).padStart(2,'0')+' / 04';$('#bar').style.width=(t/DUR*100).toFixed(2)+'%'};window.renderFrame(0,{});window.__ready=true})();
</script></body></html>
