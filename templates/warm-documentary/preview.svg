<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="温暖纪实模板预览">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332820"/>
      <stop offset=".55" stop-color="#241c17"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="sun" cx=".72" cy=".2" r=".7">
      <stop offset="0" stop-color="#e0a96d" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e0a96d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="photoA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b184"/>
      <stop offset=".58" stop-color="#8a5f40"/>
      <stop offset="1" stop-color="#38271c"/>
    </linearGradient>
    <linearGradient id="photoB" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#4b3324"/>
      <stop offset="1" stop-color="#241a14"/>
    </linearGradient>
    <radialGradient id="cup" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c69463"/>
      <stop offset="1" stop-color="#7d5335"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#warm)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".55"/>
  <rect x="0" y="0" width="1920" height="96" fill="#100b08"/>
  <rect x="0" y="984" width="1920" height="96" fill="#100b08"/>
  <rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="120"/>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="150" y="222" font-family="Consolas, monospace" font-size="13" letter-spacing="5" fill="#e0a96d" opacity=".8">A NUTCUT DOCUMENTARY · 2026</text>
    <text x="150" y="296" font-size="22" letter-spacing="2" fill="#f0e2cd" opacity=".62">有些故事，不需要说得太快。</text>
    <text x="146" y="452" font-family="Songti SC, SimSun, Georgia, serif" font-size="112" font-weight="700" letter-spacing="2" fill="#f4e9d8">把日子，</text>
    <text x="146" y="580" font-family="Songti SC, SimSun, Georgia, serif" font-size="112" font-weight="700" letter-spacing="2" fill="#f4e9d8">过成<span fill="#e0a96d">故事</span></text>
    <rect x="150" y="640" width="330" height="1" fill="#e0a96d" opacity=".6"/>
    <text x="150" y="690" font-family="Consolas, monospace" font-size="14" letter-spacing="6" fill="#f0e2cd" opacity=".5">A QUIET DOCUMENTARY</text>
  </g>

  <g transform="translate(1120 250)">
    <rect width="330" height="204" fill="url(#photoA)"/>
    <rect width="330" height="204" fill="none" stroke="#0a0705" stroke-opacity=".5" stroke-width="16"/>
    <path d="M0 0L150 0 0 130Z" fill="#ffe8c7" opacity=".28"/>
    <text x="0" y="240" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#f0e2cd" opacity=".8">清晨六点</text>
    <text x="0" y="264" font-family="Consolas, monospace" font-size="11" letter-spacing="2" fill="#f0e2cd" opacity=".42">WINDOW / 05:58</text>
  </g>
  <g transform="translate(1490 330)">
    <rect width="290" height="180" fill="url(#photoB)"/>
    <circle cx="95" cy="92" r="44" fill="url(#cup)"/>
    <circle cx="95" cy="92" r="30" fill="#5b3a26" opacity=".8"/>
    <rect width="290" height="180" fill="none" stroke="#0a0705" stroke-opacity=".5" stroke-width="14"/>
    <text x="0" y="214" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#f0e2cd" opacity=".8">一杯热水</text>
    <text x="0" y="238" font-family="Consolas, monospace" font-size="11" letter-spacing="2" fill="#f0e2cd" opacity=".42">TABLE / 06:12</text>
  </g>

  <g transform="translate(1150 700)">
    <path d="M0 0C80 6 180 -10 260 0" fill="none" stroke="#e0a96d" stroke-opacity=".35"/>
    <text x="0" y="54" font-family="Songti SC, SimSun, serif" font-size="30" fill="#f0e2cd" opacity=".72">镜头停久一点，情绪才有地方落下。</text>
  </g>

  <g font-family="Consolas, monospace" font-size="11" letter-spacing="3" fill="#f0e2cd" opacity=".35">
    <text x="150" y="1042">NUTCUT / FILM</text>
    <path d="M330 1038H1620" stroke="#f0e2cd" stroke-opacity=".12"/>
    <text x="1780" y="1042" text-anchor="end" fill="#e0a96d" opacity=".8">01 / 06</text>
  </g>
</svg>
