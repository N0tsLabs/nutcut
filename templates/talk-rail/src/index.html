<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>口播侧栏 · Talk Rail</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#101318; }
  body { font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif; color:#f7f2ea; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:#101318; }
  .rail { position:absolute; left:0; top:0; bottom:0; width:360px; background:#171b22; border-right:1px solid rgba(255,255,255,.1); padding:78px 46px; z-index:5; }
  .brand { font:800 14px/1 "Consolas",monospace; letter-spacing:.2em; color:#ff9d78; }
  .rail h1 { margin-top:24px; font-size:54px; line-height:1.08; font-weight:900; letter-spacing:-.05em; }
  .rail h1 em { font-style:normal; color:#ff9d78; }
  .steps { margin-top:54px; display:grid; gap:12px; }
  .step { display:flex; gap:14px; align-items:baseline; border-top:1px solid rgba(255,255,255,.1); padding-top:12px; font-size:17px; color:rgba(247,242,234,.38); }
  .step b { font:800 12px/1 "Consolas",monospace; color:rgba(247,242,234,.4); width:22px; }
  .step.active { color:#fff; border-color:#ff9d78; }
  .step.active b { color:#ff9d78; }
  .rail-foot { position:absolute; left:46px; bottom:48px; font:800 12px/1 "Consolas",monospace; letter-spacing:.14em; color:rgba(247,242,234,.36); }
  .stage-right { position:absolute; left:360px; right:0; top:0; bottom:0; z-index:4; }
  .video { position:absolute; right:84px; top:150px; width:980px; height:550px; border-radius:16px; background:#272c36; border:1px solid rgba(255,255,255,.15); display:grid; place-items:center; color:rgba(255,255,255,.45); font:800 15px/1 "Consolas",monospace; letter-spacing:.14em; box-shadow:0 30px 80px rgba(0,0,0,.32); }
  .video::before { content:""; position:absolute; inset:22px; border:1px dashed rgba(255,255,255,.14); border-radius:10px; }
  .caption { position:absolute; right:84px; top:756px; width:980px; }
  .caption .k { font:800 13px/1 "Consolas",monospace; letter-spacing:.18em; color:#ff9d78; margin-bottom:14px; }
  .caption h2 { font-size:54px; line-height:1.15; font-weight:900; letter-spacing:-.04em; }
  .caption h2 em { font-style:normal; color:#ff9d78; }
  .caption p { margin-top:14px; font-size:22px; line-height:1.6; color:rgba(247,242,234,.58); max-width:820px; }
  .hud { position:absolute; left:406px; right:84px; bottom:48px; z-index:6; display:flex; align-items:center; gap:18px; font:800 12px/1 "Consolas",monospace; letter-spacing:.14em; color:rgba(247,242,234,.4); }
  .hud .bar { flex:1; height:3px; background:rgba(255,255,255,.12); border-radius:2px; overflow:hidden; }
  .hud .bar i { display:block; height:100%; width:0; background:#ff9d78; }
</style>
</head>
<body>
<div id="stage">
  <aside class="rail">
    <div class="brand">TALK RAIL / 01</div>
    <h1>左边是<br><em>结构</em><br>右边是人</h1>
    <div class="steps" id="steps">
      <div class="step active"><b>01</b><span>先给结论</span></div>
      <div class="step"><b>02</b><span>再讲原因</span></div>
      <div class="step"><b>03</b><span>给一个例子</span></div>
      <div class="step"><b>04</b><span>最后收住</span></div>
    </div>
    <div class="rail-foot">10 SEC / 4 CHAPTERS</div>
  </aside>
  <main class="stage-right">
    <div class="video">视频占位</div>
    <div class="caption"><div class="k" id="kicker">CHAPTER 01</div><h2 id="title">先给<em>结论</em></h2><p id="text">观众只需要知道这一页要说什么。</p></div>
  </main>
  <div class="hud"><span id="idx">01 / 04</span><div class="bar"><i id="bar"></i></div><span>10 SEC</span></div>
</div>
<script>
(function(){
  var FPS=30,DUR=10,$=function(s){return document.querySelector(s)};
  var data=[
    {t:'先给<em>结论</em>',p:'观众只需要知道这一页要说什么。'},
    {t:'再讲<em>原因</em>',p:'一句话解释为什么，不要展开成论文。'},
    {t:'给一个<em>例子</em>',p:'具体场景比抽象概念更容易被记住。'},
    {t:'最后<em>收住</em>',p:'用一个动作或一句短话结束。'}
  ];
  var steps=[].slice.call(document.querySelectorAll('.step'));
  function clamp(v){return Math.max(0,Math.min(1,v))}
  function cubicBezier(x1,y1,x2,y2){var cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;function fx(t){return((ax*t+bx)*t+cx)*t}function dfx(t){return(3*ax*t+2*bx)*t+cx}function fy(t){return((ay*t+by)*t+cy)*t}return function(v){v=clamp(v);var t=v;for(var i=0;i<6;i++){var x=fx(t)-v;if(Math.abs(x)<1e-5)break;var d=dfx(t);if(Math.abs(d)<1e-5)break;t=clamp(t-x/d)}return fy(t)}}
  var ease=cubicBezier(.16,1,.3,1);function smooth(v){return ease(v)}
  window.renderFrame=function(frame,inputs){
    var t=Math.max(0,frame/FPS),active=Math.min(3,Math.floor(t/2.5));
    steps.forEach(function(s,i){s.classList.toggle('active',i===active)});
    $('#kicker').textContent='CHAPTER '+String(active+1).padStart(2,'0');
    $('#title').innerHTML=data[active].t;
    $('#text').textContent=data[active].p;
    var local=t-active*2.5,e=smooth(local/.5);
    $('.caption').style.opacity=e.toFixed(3);
    $('.caption').style.transform='translateY('+((1-e)*18).toFixed(1)+'px)';
    $('.video').style.opacity=(0.75+e*0.25).toFixed(3);
    $('#idx').textContent=String(active+1).padStart(2,'0')+' / 04';
    $('#bar').style.width=(t/DUR*100).toFixed(2)+'%';
  };
  window.renderFrame(0,{}); window.__ready=true;
})();
</script>
</body>
</html>
