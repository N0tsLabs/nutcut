<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="自然有机模板预览">
  <defs>
    <radialGradient id="nbg" cx=".15" cy=".1" r=".9">
      <stop offset="0" stop-color="#fbf8f0"/>
      <stop offset=".6" stop-color="#f3efe4"/>
      <stop offset="1" stop-color="#e9e3d3"/>
    </radialGradient>
    <linearGradient id="leafG" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7a9e6f"/>
      <stop offset="1" stop-color="#b7c9a8"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#nbg)"/>
  <circle cx="1640" cy="260" r="330" fill="#7a9e6f" opacity=".14" filter="url(#soft)"/>
  <circle cx="240" cy="900" r="260" fill="#c98a5e" opacity=".12" filter="url(#soft)"/>

  <g font-family="YouYuan, Microsoft YaHei, PingFang SC, sans-serif">
    <g transform="translate(112 214)">
      <rect y="-18" width="26" height="2" fill="#c98a5e"/>
      <text x="42" y="-10" font-size="12" font-family="Consolas, monospace" font-weight="700" letter-spacing="4" fill="#7a8f76">GROW SLOWLY / 01</text>
    </g>
    <text x="108" y="438" font-size="128" font-weight="900" letter-spacing="-3" fill="#23372a">慢一点，</text>
    <text x="108" y="566" font-size="128" font-weight="900" letter-spacing="-3" fill="#23372a">长<span fill="#c98a5e">出来</span></text>
    <text x="112" y="640" font-size="26" fill="#6b7f6a" letter-spacing="4">GROW WITH THE SEASON</text>
    <g transform="translate(112 700)">
      <rect width="430" height="52" rx="26" fill="#2f5d3a" fill-opacity=".08"/>
      <circle cx="30" cy="26" r="4" fill="#2f5d3a"/>
