      <path d="M0 0V1080" stroke="#111" stroke-opacity=".06"/>
    </pattern>
    <pattern id="rows" width="1920" height="90" patternUnits="userSpaceOnUse">
      <path d="M0 0H1920" stroke="#111" stroke-opacity=".035"/>
