    <text x="100" y="470" font-size="152" font-weight="900" letter-spacing="-9" fill="#111">少一点，</text>
    <text x="100" y="612" font-size="152" font-weight="900" letter-spacing="-9" fill="#111">说清楚</text>

    <rect x="1574" y="300" width="250" height="250" fill="#e30613"/>
    <path d="M1699 300V550M1574 425H1824" stroke="#fff" stroke-opacity=".7"/>

    <text x="112" y="916" font-size="22" fill="#444">FORM FOLLOWS CLARITY</text>
    <text x="112" y="960" font-size="13" letter-spacing="3" fill="#6b7280">30 SEC / 1920 × 1080 / 12 COL</text>
    <text x="1808" y="916" text-anchor="end" font-size="38" font-weight="900" letter-spacing="-1" fill="#111">FORM</text>
    <text x="1808" y="962" text-anchor="end" font-size="38" font-weight="900" letter-spacing="-1" fill="#111">FOLLOWS</text>
  </g>

  <g font-family="Helvetica Neue, Arial, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#111">
