  <path d="M96 0V1080M1824 0V1080" stroke="#111" stroke-opacity=".08"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, Microsoft YaHei, sans-serif">
    <text x="112" y="86" font-size="12" font-weight="700" letter-spacing="4" fill="#111">信息越多，越需要秩序。</text>
    <text x="1808" y="86" text-anchor="end" font-size="12" letter-spacing="4" fill="#6b7280">NUTCUT / GRID — 01</text>

