<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>图片拼贴 · Photo Grid</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#f4efe8; }
  body { font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif; color:#241d18; }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:linear-gradient(160deg,#faf5ee,#efe4d8); }
  .grid-bg { position:absolute; inset:0; opacity:.28; background-image:linear-gradient(90deg,rgba(36,29,24,.07) 1px,transparent 1px),linear-gradient(0deg,rgba(36,29,24,.05) 1px,transparent 1px); background-size:90px 90px; }
  .head { position:absolute; left:82px; right:82px; top:86px; z-index:5; display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
  .kicker { font:800 17px/1 "Consolas",monospace; letter-spacing:.2em; color:#d85b3f; }
  h1 { margin-top:18px; font-size:76px; line-height:1.05; font-weight:900; letter-spacing:-.055em; }
  h1 em { font-style:normal; color:#d85b3f; }
  .count { font:900 112px/.8 "Consolas",monospace; color:rgba(36,29,24,.08); letter-spacing:-.08em; }
  .grid { position:absolute; left:82px; right:82px; top:420px; bottom:380px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:18px; z-index:4; }
  .tile { position:relative; border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,.8); background:#ddd; box-shadow:0 18px 40px rgba(60,38,26,.12); transition:none; }
  .tile .img { position:absolute; inset:0; background-size:cover; background-position:center; transform:scale(1.02); }
  .tile .label { position:absolute; left:18px; bottom:16px; z-index:2; color:#fff; font:800 15px/1 "Consolas",monospace; letter-spacing:.12em; text-shadow:0 2px 12px rgba(0,0,0,.4); }
  .t1 .img { background-color:#b9a99b; }
  .t2 .img { background-color:#7f9e99; }
  .t3 .img { background-color:#b58b9c; }
  .t4 .img { background-color:#8f95bd; }
  .tile.active { z-index:3; box-shadow:0 34px 80px rgba(60,38,26,.24); }
  .tile.active .img { transform:scale(1.12); }
  .caption { position:absolute; left:82px; right:82px; bottom:130px; z-index:6; display:flex; gap:24px; align-items:flex-end; border-top:2px solid rgba(36,29,24,.16); padding-top:22px; }
  .caption b { font:900 24px/1 "Consolas",monospace; color:#d85b3f; width:48px; flex:none; }
  .caption p { font-size:32px; line-height:1.45; font-weight:700; max-width:820px; }
  .hud { position:absolute; left:82px; right:82px; bottom:58px; z-index:8; display:flex; align-items:center; gap:18px; font:800 14px/1 "Consolas",monospace; letter-spacing:.14em; color:rgba(36,29,24,.45); }
  .hud .bar { flex:1; height:3px; border-radius:2px; background:rgba(36,29,24,.12); overflow:hidden; }
  .hud .bar i { display:block; height:100%; width:0; background:#d85b3f; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid-bg"></div>
  <div class="head"><div><div class="kicker" id="kicker">PHOTO GRID / 01</div><h1>四张图<br><em>讲一件事</em></h1></div><div class="count">04</div></div>
  <div class="grid">
    <div class="tile t1"><div class="img"></div><div class="label">PHOTO 01</div></div>
    <div class="tile t2"><div class="img"></div><div class="label">PHOTO 02</div></div>
    <div class="tile t3"><div class="img"></div><div class="label">PHOTO 03</div></div>
    <div class="tile t4"><div class="img"></div><div class="label">PHOTO 04</div></div>
  </div>
  <div class="caption"><b id="capNo">01</b><p id="capText">先让四张图站好位置，再用一句话把它们串起来。</p></div>
  <div class="hud"><span id="idx">01 / 04</span><div class="bar"><i id="bar"></i></div><span>10 SEC</span></div>
</div>
<script>
(function(){
  var FPS=30,DUR=10,$=function(s){return document.querySelector(s)};
  var tiles=[].slice.call(document.querySelectorAll('.tile'));
  var caps=['先让四张图站好位置，再用一句话把它们串起来。','当前图片放大，其他图片退后，视线就有落点。','图片之间要有节奏：快、慢、停、再走。','最后一张图，负责把情绪收住。'];
  function clamp(v){return Math.max(0,Math.min(1,v))}
  function cubicBezier(x1,y1,x2,y2){
    var cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
    function fx(t){return ((ax*t+bx)*t+cx)*t}
    function dfx(t){return (3*ax*t+2*bx)*t+cx}
    function fy(t){return ((ay*t+by)*t+cy)*t}
    return function(v){v=clamp(v);var t=v;for(var i=0;i<6;i++){var x=fx(t)-v;if(Math.abs(x)<1e-5)break;var d=dfx(t);if(Math.abs(d)<1e-5)break;t=clamp(t-x/d)}return fy(t)}
  }
  var ease=cubicBezier(.16,1,.3,1);
  function smooth(v){return ease(v)}
  window.renderFrame=function(frame,inputs){
    inputs=inputs||{};
    var t=Math.max(0,frame/FPS), active=Math.min(3,Math.floor(t/2.5));
    tiles.forEach(function(tile,i){
      var isActive=i===active;
      tile.classList.toggle('active',isActive);
      var scale=isActive?1.02:0.98;
      var local=Math.max(0,t-active*2.5);
      var e=smooth(local/.6);
      tile.style.transform='scale('+(scale+(isActive?(e*.10):0)).toFixed(3)+') translateY('+(isActive?0:6)+'px)';
      tile.style.opacity=isActive?1:(0.58+Math.abs(i-active)*.05).toFixed(2);
    });
    $('#capNo').textContent=String(active+1).padStart(2,'0');
    $('#capText').textContent=caps[active];
    $('#kicker').textContent='PHOTO GRID / '+String(active+1).padStart(2,'0');
    $('#idx').textContent=String(active+1).padStart(2,'0')+' / 04';
    $('#bar').style.width=(t/DUR*100).toFixed(2)+'%';
    var images=inputs.images||[];
    if(images.length>=4){
      tiles.forEach(function(tile,i){
        var img=tile.querySelector('.img');
        var image=images[i];
        var url=image && (typeof image==='string'?image:image.url);
        if(url)img.style.backgroundImage='url("'+url+'")';
      });
    }
  };
  window.renderFrame(0,{}); window.__ready=true;
})();
</script>
</body>
</html>
