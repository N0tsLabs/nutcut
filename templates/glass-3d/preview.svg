<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="玻璃拟态 3D 模板预览">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0817"/><stop offset=".5" stop-color="#140b28"/><stop offset="1" stop-color="#08060f"/>
    </linearGradient>
    <radialGradient id="o1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4de2c5" stop-opacity=".34"/><stop offset="1" stop-color="#4de2c5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o3" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff9e6d" stop-opacity=".26"/><stop offset="1" stop-color="#ff9e6d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#ffffff" stop-opacity=".09"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a4ff"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9af5e0"/><stop offset="1" stop-color="#4de2c5"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d83ff"/><stop offset="1" stop-color="#7c5cff" stop-opacity=".3"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1500" cy="240" r="520" fill="url(#o1)"/>
  <circle cx="240" cy="860" r="420" fill="url(#o2)"/>
  <circle cx="1080" cy="960" r="380" fill="url(#o3)"/>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <g transform="translate(136 210)">
      <rect width="28" height="1" fill="#4de2c5"/>
      <text x="42" y="5" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="5" fill="#4de2c5">01 / 玻璃之后 · BEHIND THE GLASS</text>
    </g>
    <text x="132" y="404" font-size="126" font-weight="900" letter-spacing="-6" fill="#ffffff">玻璃之后的光</text>
    <text x="136" y="466" font-size="25" letter-spacing="2" fill="#f2eefb" fill-opacity=".6">GLASS 3D · 30S / 折射与层叠</text>
  </g>

  <!-- tilted glass frame + slot -->
  <g transform="translate(1460 468) rotate(-6) skewY(3) translate(-700 -280)">
    <rect width="734" height="560" rx="18" fill="url(#g1)" stroke="#ffffff" stroke-opacity=".22"/>
    <rect x="16" y="16" width="702" height="528" rx="14" fill="#0b0817" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".14" stroke-dasharray="7 7"/>
    <circle cx="367" cy="280" r="86" fill="none" stroke="#4de2c5" stroke-opacity=".22"/>
    <g text-anchor="middle">
      <text x="367" y="262" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="900" fill="#ffffff" fill-opacity=".9">图片位 01</text>
      <text x="367" y="292" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="6" fill="#4de2c5">IMAGE SLOT 01</text>
      <text x="367" y="318" font-family="Consolas, monospace" font-size="11" letter-spacing="4" fill="#f2eefb" fill-opacity=".4">主视觉 / KEY VISUAL</text>
    </g>
  </g>

  <!-- glass stats -->
  <g>
    <rect x="172" y="560" width="780" height="240" rx="22" fill="url(#g1)" stroke="#ffffff" stroke-opacity=".18"/>
    <g font-family="Consolas, monospace">
      <g><text x="206" y="640" font-size="38" font-weight="900" fill="#ffffff">03</text>
        <text x="206" y="670" font-size="10" letter-spacing="2" fill="#f2eefb" fill-opacity=".5">LAYERS / 层级</text></g>
      <g><text x="380" y="640" font-size="38" font-weight="900" fill="#ffffff">22px</text>
        <text x="380" y="670" font-size="10" letter-spacing="2" fill="#f2eefb" fill-opacity=".5">BLUR / 模糊</text></g>
      <g><text x="560" y="640" font-size="38" font-weight="900" fill="#ffffff">1.4</text>
        <text x="560" y="670" font-size="10" letter-spacing="2" fill="#f2eefb" fill-opacity=".5">SATURATION</text></g>
      <g><text x="720" y="640" font-size="38" font-weight="900" fill="#ffffff">06</text>
        <text x="720" y="670" font-size="10" letter-spacing="2" fill="#f2eefb" fill-opacity=".5">SCENES / 场景</text></g>
    </g>
  </g>

  <!-- rings -->
  <g transform="translate(136 776)">
    <rect width="1120" height="200" rx="22" fill="url(#g1)" stroke="#ffffff" stroke-opacity=".16"/>
    <g transform="translate(120 100)">
      <circle r="62" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="9"/>
      <circle r="62" fill="none" stroke="url(#sh)" stroke-width="9" stroke-linecap="round" stroke-dasharray="358" stroke-dashoffset="29" transform="rotate(-90)"/>
      <text x="86" y="-4" font-family="Consolas, monospace" font-size="26" font-weight="900" fill="#ffffff">92%</text>
      <text x="86" y="24" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#f2eefb" fill-opacity=".55">结构完整度</text>
    </g>
    <g transform="translate(440 100)">
      <circle r="62" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="9"/>
      <circle r="62" fill="none" stroke="url(#gr)" stroke-width="9" stroke-linecap="round" stroke-dasharray="358" stroke-dashoffset="79" transform="rotate(-90)"/>
      <text x="86" y="-4" font-family="Consolas, monospace" font-size="26" font-weight="900" fill="#ffffff">78%</text>
      <text x="86" y="24" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#f2eefb" fill-opacity=".55">光通过率</text>
    </g>
    <g transform="translate(760 100)">
      <circle r="62" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="9"/>
      <circle r="62" fill="none" stroke="url(#o3)" stroke-width="9" stroke-linecap="round" stroke-dasharray="358" stroke-dashoffset="129" transform="rotate(-90)"/>
      <text x="86" y="-4" font-family="Consolas, monospace" font-size="26" font-weight="900" fill="#ffffff">64%</text>
      <text x="86" y="24" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#f2eefb" fill-opacity=".55">色彩偏移</text>
    </g>
  </g>

  <g font-family="Consolas, monospace" font-size="12" letter-spacing="3" fill="#f2eefb" fill-opacity=".4">
    <text x="136" y="1028">NUTCUT / GLASS</text>
    <text x="1784" y="1028" text-anchor="end" fill="#4de2c5">01 / 06</text>
  </g>
</svg>
