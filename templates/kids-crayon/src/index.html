<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>儿童蜡笔 · Kids Crayon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff8e1; }
  body { font-family: "YouYuan", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif; color: #2f2a25; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background:
      radial-gradient(760px 560px at 8% 8%, rgba(255,255,255,.95), transparent 68%),
      radial-gradient(700px 520px at 92% 90%, rgba(255,126,182,.1), transparent 66%),
      #fff8e1; }
  .crayon { position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: .5;
    background-image:
      repeating-linear-gradient(24deg, rgba(255,183,3,.09) 0 3px, transparent 3px 11px),
      repeating-linear-gradient(-38deg, rgba(74,168,255,.06) 0 2px, transparent 2px 13px); }
  #fx { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 0; }
  .scene { position: absolute; inset: 0; visibility: hidden; opacity: 0; z-index: 5; }
  .inner { position: absolute; left: 112px; right: 112px; }
  .tag { display: inline-flex; align-items: center; gap: 12px; padding: 12px 20px; background: #fff; border: 3px dashed #ffb703;
    border-radius: 22px 18px 24px 16px; font: 700 13px/1 "Consolas", monospace; letter-spacing: .16em; color: #8a7a5c; transform: rotate(-1.4deg); }
  .tag b { color: #ff7eb6; }
  h1, h2 { font-weight: 900; color: #2f2a25; }
  .ch { display: inline-block; }
  em { font-style: normal; color: #ff7eb6; }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .wobble { border-radius: 48px 38px 52px 42px / 42px 52px 38px 48px; }

  .s1 { top: 236px; }
  .s1 .tag { margin-bottom: 30px; }
  .s1 h1 { width: 1330px; font-size: 142px; line-height: 1.12; letter-spacing: -.01em; transform: rotate(-1deg); }
  .s1 .sub { margin-top: 30px; font-size: 26px; letter-spacing: .12em; color: #8a7a5c; }
  .sun { position: absolute; right: 20px; top: -30px; width: 400px; height: 400px; }
  .s1 .star { position: absolute; width: 66px; height: 66px; }
  .s1 .star.a { left: 1130px; top: 90px; }
  .s1 .star.b { right: 120px; bottom: -150px; width: 44px; height: 44px; }
  .s1 .star.c { left: 900px; bottom: -190px; width: 36px; height: 36px; }

  .s2 { top: 0; height: 100%; }
  .s2 .tag { position: absolute; left: 0; top: 148px; }
  .s2 .cloud { position: absolute; left: 112px; top: 210px; width: 1180px; min-height: 340px; padding: 64px 90px;
    background: #fff; border: 6px solid #4aa8ff; border-radius: 48% 52% 46% 54% / 42% 38% 62% 58%;
    box-shadow: 12px 14px 0 rgba(74,168,255,.18); }
  .s2 .cloud::after { content: ""; position: absolute; left: 170px; bottom: -44px; width: 90px; height: 90px; background: #fff;
    border-left: 6px solid #4aa8ff; border-bottom: 6px solid #4aa8ff; transform: rotate(-18deg) skewX(12deg); border-radius: 0 0 0 60%; }
  .s2 .cloud h2 { font-size: 58px; line-height: 1.5; letter-spacing: .01em; }
  .s2 .house { position: absolute; right: 66px; bottom: 130px; width: 590px; height: 360px; }
  .s2 .ground { position: absolute; left: 0; right: 0; bottom: 118px; height: 6px; background: #ffb703; opacity: .5; border-radius: 99px; }

  .s3 { top: 170px; }
  .s3 h2 { margin-top: 24px; width: 1440px; font-size: 82px; line-height: 1.16; letter-spacing: -.01em; }
  .cards { margin-top: 62px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 38px; }
  .kcard { position: relative; height: 440px; padding: 38px 36px; background: #fff; border: 6px solid #2f2a25;
    border-radius: 34px 26px 38px 28px / 28px 38px 26px 34px; box-shadow: 10px 12px 0 rgba(47,42,37,.12); }
  .kcard:nth-child(1) { background: #fff4c2; }
  .kcard:nth-child(2) { background: #ffe3ef; }
  .kcard:nth-child(3) { background: #e2f1ff; }
  .kcard .icon { width: 100px; height: 100px; }
  .kcard h3 { margin-top: 26px; font-size: 52px; font-weight: 900; letter-spacing: .02em; }
  .kcard p { margin-top: 12px; font-size: 20px; line-height: 1.7; color: #6b5c48; }
  .kcard .no { position: absolute; right: 30px; top: 26px; font: 900 30px/1 "Consolas", monospace; color: rgba(47,42,37,.18); }

  .s4 { top: 190px; }
  .s4 h2 { margin-top: 24px; width: 1400px; font-size: 92px; line-height: 1.18; letter-spacing: -.01em; }
  .s4 .blob { position: relative; margin-top: 44px; width: 980px; padding: 30px 44px; background: #fff4c2;
    border: 5px dashed #ffb703; border-radius: 40% 60% 52% 48% / 52% 42% 58% 48%; }
  .s4 .blob p { font-size: 30px; color: #6b5c48; }
  .s4 .blob svg { position: absolute; inset: -16px; width: calc(100% + 32px); height: calc(100% + 32px); overflow: visible; }
  .s4 .cloud2 { position: absolute; right: 60px; top: 300px; width: 580px; padding: 48px 52px; background: #e2f1ff;
    border: 6px solid #4aa8ff; border-radius: 48% 52% 44% 56% / 46% 40% 60% 54%; transform: rotate(2deg); }
  .s4 .cloud2 b { display: block; font-size: 44px; font-weight: 900; }
  .s4 .cloud2 span { display: block; margin-top: 12px; font-size: 20px; color: #6b5c48; }

  .s5 { top: 200px; }
  .s5 .big { display: flex; align-items: flex-start; font: 900 340px/.78 "Microsoft YaHei", sans-serif; letter-spacing: -.05em; color: #ff7eb6; }
  .s5 .big small { margin-top: 26px; font-size: 80px; color: #ffb703; }
  .s5 h2 { margin-top: 40px; width: 1150px; font-size: 60px; line-height: 1.3; letter-spacing: .01em; }
  .s5 .stars { position: absolute; right: 60px; top: 40px; width: 620px; height: 520px; }
  .s5 .stars svg { position: absolute; }

  .s6 { top: 260px; text-align: center; }
  .s6 .tag { margin: 0 auto; }
  .s6 h2 { margin-top: 34px; font-size: 124px; line-height: 1.12; letter-spacing: -.01em; }
  .s6 .sub { margin-top: 28px; font-size: 24px; letter-spacing: .24em; color: #8a7a5c; }
  .s6 .note { display: inline-block; margin-top: 44px; padding: 18px 32px; background: #fff; border: 5px solid #ff7eb6;
    border-radius: 30px 22px 32px 24px; font-size: 24px; color: #2f2a25; transform: rotate(-1deg); }
  .s6 .heart { position: absolute; right: 90px; bottom: -140px; width: 120px; height: 110px; transform: rotate(8deg); }
  .s6 .byebye { position: absolute; left: 90px; bottom: -150px; font: 700 16px/1 "Consolas", monospace; letter-spacing: .3em; color: #8a7a5c; }

  .hud { position: absolute; left: 112px; right: 112px; bottom: 40px; z-index: 20; display: flex; align-items: center; gap: 22px;
    font: 700 11px/1 "Consolas", monospace; letter-spacing: .18em; color: #8a7a5c; }
  .hud .track { flex: 1; height: 8px; background: rgba(47,42,37,.1); border-radius: 99px; overflow: hidden; }
  .hud .track i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(45deg, #ffb703 0 8px, #ff7eb6 8px 16px, #4aa8ff 16px 24px); }
  .hud .idx { color: #ff7eb6; }
  @media (max-width: 900px) { body { zoom: .5; } }

  .nutcut-image-slot { position: absolute; right: 112px; bottom: 112px; width: 280px; height: 158px; border: 1px dashed #8a93a1; opacity: .62; display: grid; place-items: center; font: 700 11px/1 "Consolas", monospace; letter-spacing: .2em; z-index: 9; pointer-events: none; color: #8a93a1; }
  .nutcut-image-slot::before { content: ""; position: absolute; inset: 12px; border: 1px solid currentColor; opacity: .22; }
  .nutcut-image-slot span { position: relative; }
  .nutcut-image-slot.has-image { opacity: .9; border-style: solid; background-size: cover; background-position: center; }
  .nutcut-image-slot.has-image span { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div class="crayon"></div>

  <section class="scene" id="sc1">
    <div class="inner s1">
      <div class="tag"><b>01</b><span id="s1-kicker"></span></div>
      <h1 id="s1-title" data-title></h1>
      <p class="sub" id="s1-sub" data-sub></p>
      <svg class="star a" viewBox="0 0 66 66"><path d="M33 4L41 25 63 27 46 41 51 62 33 50 15 62 20 41 3 27 25 25Z" fill="#ffb703" stroke="#2f2a25" stroke-width="3" stroke-linejoin="round"/></svg>
      <svg class="star b" viewBox="0 0 44 44"><path d="M22 3L27 16 42 18 31 27 34 41 22 34 10 41 13 27 2 18 17 16Z" fill="#ff7eb6" stroke="#2f2a25" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <svg class="star c" viewBox="0 0 36 36"><path d="M18 3L22 13 34 15 25 22 28 33 18 27 8 33 11 22 2 15 14 13Z" fill="#4aa8ff" stroke="#2f2a25" stroke-width="2.5" stroke-linejoin="round"/></svg>
    </div>
    <svg class="sun" viewBox="0 0 400 400" aria-hidden="true">
      <circle cx="200" cy="200" r="104" fill="#ffd23f" stroke="#2f2a25" stroke-width="6"/>
      <circle cx="168" cy="180" r="9" fill="#2f2a25"/><circle cx="232" cy="180" r="9" fill="#2f2a25"/>
      <path d="M160 222C178 248 222 248 240 222" fill="none" stroke="#2f2a25" stroke-width="6" stroke-linecap="round"/>
      <g stroke="#ffb703" stroke-width="7" stroke-linecap="round">
        <path d="M200 34V66"/><path d="M200 334V366"/><path d="M34 200H66"/><path d="M334 200H366"/>
        <path d="M82 82L105 105"/><path d="M295 295L318 318"/><path d="M318 82L295 105"/><path d="M105 295L82 318"/>
      </g>
    </svg>
  </section>

  <section class="scene" id="sc2">
    <div class="inner s2">
      <div class="tag"><b>02</b><span>DRAW WITH ME</span></div>
      <div class="cloud" id="s2-cloud"><h2 id="s2-quote"></h2></div>
      <svg class="house" viewBox="0 0 590 360" aria-hidden="true">
        <path d="M60 330V180L190 84 320 180V330Z" fill="#fff" stroke="#2f2a25" stroke-width="6" stroke-linejoin="round"/>
        <path d="M36 190L190 74 344 190" fill="none" stroke="#ff7eb6" stroke-width="10" stroke-linecap="round"/>
        <rect x="110" y="220" width="80" height="110" fill="#e2f1ff" stroke="#2f2a25" stroke-width="5"/>
        <rect x="230" y="220" width="60" height="60" fill="#fff4c2" stroke="#2f2a25" stroke-width="5"/>
        <path d="M260 220V280M230 250H290" stroke="#2f2a25" stroke-width="4"/>
        <path d="M400 340V210" stroke="#2f2a25" stroke-width="6"/>
        <circle cx="400" cy="180" r="52" fill="#ffd23f" stroke="#2f2a25" stroke-width="5"/>
        <path d="M384 174C390 182 410 182 416 174" fill="none" stroke="#2f2a25" stroke-width="4" stroke-linecap="round"/>
        <path d="M330 342C380 320 450 324 520 344" fill="none" stroke="#ffb703" stroke-width="8" stroke-linecap="round"/>
      </svg>
    </div>
  </section>

  <section class="scene" id="sc3">
    <div class="inner s3">
      <div class="tag"><b>03</b><span>THREE LITTLE THINGS</span></div>
      <h2 id="s3-title"></h2>
      <div class="cards">
        <article class="kcard">
          <div class="no">01</div>
          <svg class="icon" viewBox="0 0 100 100"><circle cx="50" cy="26" r="14" fill="#ff7eb6" stroke="#2f2a25" stroke-width="4"/><circle cx="28" cy="46" r="14" fill="#ff7eb6" stroke="#2f2a25" stroke-width="4"/><circle cx="72" cy="46" r="14" fill="#ff7eb6" stroke="#2f2a25" stroke-width="4"/><circle cx="38" cy="70" r="14" fill="#ff7eb6" stroke="#2f2a25" stroke-width="4"/><circle cx="62" cy="70" r="14" fill="#ff7eb6" stroke="#2f2a25" stroke-width="4"/><circle cx="50" cy="50" r="9" fill="#ffd23f" stroke="#2f2a25" stroke-width="3"/></svg>
          <h3>画太阳</h3><p>先画一个圆，再给它加上笑弯弯的眼睛。</p>
        </article>
        <article class="kcard">
          <div class="no">02</div>
          <svg class="icon" viewBox="0 0 100 100"><path d="M50 88C50 60 50 34 50 18" stroke="#2f5d3a" stroke-width="5" stroke-linecap="round"/><path d="M50 54C34 52 22 42 18 28 34 30 46 40 50 54Z" fill="#7bc47f" stroke="#2f2a25" stroke-width="3"/><path d="M50 42C66 40 78 30 82 16 66 18 54 28 50 42Z" fill="#7bc47f" stroke="#2f2a25" stroke-width="3"/><circle cx="50" cy="16" r="10" fill="#ffd23f" stroke="#2f2a25" stroke-width="3"/></svg>
          <h3>画小花</h3><p>五片花瓣，一片也不能少，颜色可以随便挑。</p>
        </article>
        <article class="kcard">
          <div class="no">03</div>
          <svg class="icon" viewBox="0 0 100 100"><path d="M50 86C20 66 8 48 14 32 20 18 40 18 50 34 60 18 80 18 86 32 92 48 80 66 50 86Z" fill="#ff7eb6" stroke="#2f2a25" stroke-width="4" stroke-linejoin="round"/></svg>
          <h3>画爱心</h3><p>把喜欢的人画在旁边，涂上最亮的颜色。</p>
        </article>
      </div>
    </div>
  </section>

  <section class="scene" id="sc4">
    <div class="inner s4">
      <div class="tag"><b>04</b><span>OOPS, THAT'S OK</span></div>
      <h2 id="s4-title"></h2>
      <div class="blob">
        <p>哎呀，颜色涂到线外面了……</p>
        <svg viewBox="0 0 980 140" preserveAspectRatio="none" aria-hidden="true">
          <path class="draw" id="s4-cross1" d="M30 116C210 40 400 128 580 60S860 34 950 96" fill="none" stroke="#ff7eb6" stroke-width="9" stroke-linecap="round" pathLength="1"/>
          <path class="draw" id="s4-cross2" d="M40 52C240 124 460 36 660 104S900 122 946 56" fill="none" stroke="#4aa8ff" stroke-width="6" stroke-linecap="round" pathLength="1"/>
        </svg>
      </div>
      <div class="cloud2"><b>没关系！</b><span>涂出去的那一块，正好可以变成一朵云。</span></div>
    </div>
  </section>

  <section class="scene" id="sc5">
    <div class="inner s5">
      <div class="tag"><b>05</b><span>COUNT THE STARS</span></div>
      <div class="big" style="margin-top:34px"><span id="s5-num">0</span><small>颗</small></div>
      <h2 id="s5-title"></h2>
      <div class="stars">
        <svg style="left:0;top:60px" width="100" height="100" viewBox="0 0 100 100"><path d="M50 6L62 36 94 39 69 59 77 90 50 73 23 90 31 59 6 39 38 36Z" fill="#ffd23f" stroke="#2f2a25" stroke-width="4" stroke-linejoin="round"/></svg>
        <svg style="left:150px;top:190px" width="72" height="72" viewBox="0 0 100 100"><path d="M50 6L62 36 94 39 69 59 77 90 50 73 23 90 31 59 6 39 38 36Z" fill="#ff7eb6" stroke="#2f2a25" stroke-width="4" stroke-linejoin="round"/></svg>
        <svg style="left:330px;top:20px" width="84" height="84" viewBox="0 0 100 100"><path d="M50 6L62 36 94 39 69 59 77 90 50 73 23 90 31 59 6 39 38 36Z" fill="#4aa8ff" stroke="#2f2a25" stroke-width="4" stroke-linejoin="round"/></svg>
        <svg style="left:430px;top:230px" width="66" height="66" viewBox="0 0 100 100"><path d="M50 6L62 36 94 39 69 59 77 90 50 73 23 90 31 59 6 39 38 36Z" fill="#ffd23f" stroke="#2f2a25" stroke-width="4" stroke-linejoin="round"/></svg>
        <svg style="left:250px;top:360px" width="58" height="58" viewBox="0 0 100 100"><path d="M50 6L62 36 94 39 69 59 77 90 50 73 23 90 31 59 6 39 38 36Z" fill="#ff7eb6" stroke="#2f2a25" stroke-width="4" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </section>

  <section class="scene" id="sc6">
    <div class="inner s6">
      <div class="tag"><b>06</b><span>THE END</span></div>
      <h2 id="s6-title" data-title></h2>
      <p class="sub" id="s6-sub" data-sub></p>
      <div class="note" id="s6-note"></div>
      <div class="byebye">SEE YOU NEXT DRAWING</div>
      <svg class="heart" viewBox="0 0 120 110"><path d="M60 100C24 76 6 54 14 34 22 16 46 16 60 38 74 16 98 16 106 34 114 54 96 76 60 100Z" fill="#ff7eb6" stroke="#2f2a25" stroke-width="5" stroke-linejoin="round"/></svg>
    </div>
    <div class="nutcut-image-slot" data-image-slot><span>图片位 01</span></div>
  </section>

  <div class="hud">
    <span data-brand>NUTCUT / KIDS</span>
    <span class="track"><i id="hud-bar"></i></span>
    <span class="idx" id="hud-idx">01 / 06</span>
    <span id="hud-time">00:00</span>
  </div>
</div>
<script>
(function () {
  const FPS = 30, DUR = 30;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const C = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const S = (v) => { v = C(v); return v * v * (3 - 2 * v); };
  const E = (v) => 1 - Math.pow(1 - C(v), 3);
  const EI = (v) => { v = C(v); return v < .5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2; };
  const EB = (v) => { v = C(v); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(v - 1, 3) + c1 * Math.pow(v - 1, 2); };
  const R = (i, s) => { const x = Math.sin(i * 127.1 + (s || 0) * 311.7) * 43758.5453; return x - Math.floor(x); };
  const DEFAULT_TITLE = '我们一起画个世界';
  const DEFAULT_SUB = 'A CRAYON STORY';
  const DEMO = [
    { id: '01', text: '今天，我们来画一个特别的世界。', start: 0, end: 4.7 },
    { id: '02', text: '先画一个会笑的太阳。', start: 5, end: 9.7 },
    { id: '03', text: '再画三朵不一样的花。', start: 10, end: 14.7 },
    { id: '04', text: '画错了也没关系，可以变成云。', start: 15, end: 19.7 },
    { id: '05', text: '数一数，一共几颗星星？', start: 20, end: 24.7 },
    { id: '06', text: '画完啦，把它送给喜欢的人。', start: 25, end: 30.6 }
  ];
  const scenes = $$('.scene');
  let plan = [];

  function buildPlan(inputs) {
    const src = Array.isArray(inputs.lines) && inputs.lines.length ? inputs.lines.slice(0, 6) : DEMO;
    const timed = src.length === 6 && src.every((l) => Number.isFinite(l.start) && Number.isFinite(l.end) && l.end > l.start);
    plan = scenes.map((el, i) => {
      const line = src[i] || DEMO[i];
      return {
        start: timed ? src[i].start : i * 5,
        end: timed ? src[i].end : (i + 1) * 5 + .35,
        text: String(line.text == null ? DEMO[i].text : line.text),
        id: String(line.id == null ? DEMO[i].id : line.id)
      };
    });
  }

  function setText(el, value) { if (el && el.textContent !== value) el.textContent = value; }

  function setChars(el, value) {
    if (!el) return [];
    if (el.dataset.text !== value) {
      el.dataset.text = value; el.textContent = '';
      for (const ch of Array.from(value)) {
        const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch; el.appendChild(s);
      }
    }
    return Array.from(el.children);
  }

  function revealChars(list, local, delay, stagger, y) {
    list.forEach((node, i) => {
      const p = EB((local - delay - i * stagger) / .55);
      node.style.opacity = S((local - delay - i * stagger) / .3);
      node.style.transform = 'translateY(' + ((1 - Math.min(1.4, p)) * y) + '%) rotate(' + ((1 - Math.min(1, p)) * -6) + 'deg)';
    });
  }

  function applyInputs(inputs) {
    if (inputs.accent) document.documentElement.style.setProperty('--accent', inputs.accent);
    const brand = inputs.brand || 'NUTCUT / KIDS';
    $$('[data-brand]').forEach((el) => setText(el, brand));
    const title = inputs.title || DEFAULT_TITLE;
    const sub = inputs.subtitle || DEFAULT_SUB;
    $$('[data-title]').forEach((el) => setText(el, title));
    $$('[data-sub]').forEach((el) => setText(el, sub));
  }

  const fx = $('#fx');
  const g = fx.getContext('2d');
  function drawBG(t, active) {
    g.clearRect(0, 0, 1920, 1080);
    const cols = ['255,183,3', '255,126,182', '74,168,255', '123,196,127'];
    for (let i = 0; i < 90; i++) {
      const x = R(i, 1) * 1920 + Math.sin(t * .3 + i) * 12;
      const y = R(i, 2) * 1080;
      const c = cols[Math.floor(R(i, 3) * cols.length)];
      g.fillStyle = 'rgba(' + c + ',' + (.1 + R(i, 4) * .2) + ')';
      g.beginPath();
      g.arc(x, y, 1.5 + R(i, 5) * 3, 0, Math.PI * 2);
      g.fill();
    }
    for (let i = 0; i < 6; i++) {
      const x = R(i, 6) * 1920;
      const y = 120 + R(i, 7) * 840 + Math.sin(t * .25 + i) * 18;
      const s = 8 + R(i, 8) * 10;
      g.strokeStyle = 'rgba(' + cols[i % cols.length] + ',.18)';
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(x - s, y); g.lineTo(x + s, y);
      g.moveTo(x, y - s); g.lineTo(x, y + s);
      g.stroke();
    }
  }

  function updateScene1(local, t, p) {
    setText($('#s1-kicker'), p.text);
    const chars = setChars($('#s1-title'), $('#s1-title').dataset.text || DEFAULT_TITLE);
    revealChars(chars, local, .1, .04, 120);
    const sub = $('#s1-sub');
    sub.style.opacity = S((local - .85) / .6);
    sub.style.transform = 'translateY(' + ((1 - E((local - .85) / .6)) * 18) + 'px)';
    const sun = $('.sun');
    sun.style.transform = 'rotate(' + (t * 8) + 'deg) scale(' + (.9 + .1 * EB((local - .2) / .6)) + ')';
    $$('.s1 .star').forEach((el, i) => {
      el.style.opacity = S((local - .7 - i * .2) / .4);
      el.style.transform = 'scale(' + EB((local - .7 - i * .2) / .5) + ') rotate(' + (Math.sin(t * 1.2 + i) * 12) + 'deg)';
    });
  }

  function updateScene2(local, t, p) {
    const q = $('#s2-quote');
    if (q.dataset.text !== p.text) { q.dataset.text = p.text; q.textContent = p.text; }
    const e = EB((local - .1) / .6);
    $('#s2-cloud').style.opacity = S((local - .1) / .3);
    $('#s2-cloud').style.transform = 'translateY(' + ((1 - e) * 60) + 'px) rotate(' + ((1 - e) * -2) + 'deg)';
    $('.house').style.opacity = S((local - .5) / .7);
    $('.house').style.transform = 'translateY(' + ((1 - E((local - .5) / .7)) * 40) + 'px)';
  }

  function updateScene3(local, t, p) {
    setText($('#s3-title'), p.text);
    $$('.kcard').forEach((el, i) => {
      const e = EB((local - .1 - i * .16) / .7);
      el.style.opacity = S((local - .1 - i * .16) / .35);
      el.style.transform = 'translateY(' + ((1 - e) * 90) + 'px) rotate(' + ((1 - e) * [-3, 3, -2][i]) + 'deg)';
    });
  }

  function updateScene4(local, t, p) {
    setText($('#s4-title'), p.text);
    $('.s4 .blob').style.opacity = S((local - .3) / .5);
    $('.s4 .blob').style.transform = 'rotate(' + (-1 + Math.sin(t * .4) * .8) + 'deg)';
    $('#s4-cross1').style.strokeDashoffset = (1 - C((local - .8) / .5)).toFixed(3);
    $('#s4-cross2').style.strokeDashoffset = (1 - C((local - 1.05) / .5)).toFixed(3);
    $('.s4 .cloud2').style.opacity = S((local - 1.3) / .6);
    $('.s4 .cloud2').style.transform = 'rotate(2deg) translateY(' + ((1 - EB((local - 1.3) / .6)) * 40) + 'px)';
  }

  function updateScene5(local, t, p) {
    setText($('#s5-title'), p.text);
    setText($('#s5-num'), String(Math.round(5 * E((local - .2) / 1.4))));
    const stars = $$('.s5 .stars svg');
    stars.forEach((el, i) => {
      el.style.opacity = S((local - .4 - i * .16) / .4);
      el.style.transform = 'scale(' + EB((local - .4 - i * .16) / .5) + ') rotate(' + (Math.sin(t * 1.1 + i) * 10) + 'deg)';
    });
  }

  function updateScene6(local, t, p) {
    const chars = setChars($('#s6-title'), $('#s6-title').dataset.text || DEFAULT_TITLE);
    revealChars(chars, local, .1, .05, 110);
    $('#s6-sub').style.opacity = S((local - .9) / .6);
    setText($('#s6-note'), p.text);
    $('#s6-note').style.opacity = S((local - 1.2) / .6);
    $('#s6-note').style.transform = 'rotate(-1deg) translateY(' + ((1 - EB((local - 1.2) / .6)) * 26) + 'px)';
    $('.heart').style.transform = 'rotate(8deg) scale(' + EB((local - 1.5) / .6) + ')';
    $('.heart').style.opacity = S((local - 1.5) / .4);
  }

  const updates = [updateScene1, updateScene2, updateScene3, updateScene4, updateScene5, updateScene6];

  window.renderFrame = function (frame, inputs) {
    inputs = inputs || {};
    buildPlan(inputs);
    applyInputs(inputs);
    const t = frame / FPS;
    let active = 0;
    for (let i = 0; i < plan.length; i += 1) if (t >= plan[i].start - .001) active = i;
    scenes.forEach((el, i) => {
      const p = plan[i];
      const op = Math.min(S((t - p.start + .7) / .7), S((p.end - t) / .6));
      el.style.visibility = op > .001 ? 'visible' : 'hidden';
      el.style.opacity = op.toFixed(3);
    });
    updates[active](Math.max(0, t - plan[active].start) + (active === 0 ? 1.4 : 0), t, plan[active]);
    drawBG(t, active);
    $('#hud-bar').style.width = (C(t / DUR) * 100) + '%';
    setText($('#hud-idx'), String(active + 1).padStart(2, '0') + ' / 06');
    setText($('#hud-time'), '00:' + String(Math.floor(t)).padStart(2, '0'));
  };

  applyInputs({});
  window.renderFrame(0, {});
  window.__ready = true;
})();
</script>
<script>
  (function () {
    var slot = document.querySelector('[data-image-slot]');
    if (!slot) return;
    var original = window.renderFrame;
    window.renderFrame = function (frame, inputs) {
      var image = inputs && inputs.images && inputs.images[0];
      var url = image && (typeof image === 'string' ? image : image.url);
      if (url) { slot.style.backgroundImage = 'url("' + url + '")'; slot.classList.add('has-image'); }
      else { slot.style.backgroundImage = ''; slot.classList.remove('has-image'); }
      return original(frame, inputs);
    };
  })();
</script>
</body>
</html>
