<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>图片分屏 · Photo Split</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#111417}body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;color:#fff}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#111417}
  .half{position:absolute;left:0;right:0;height:50%;overflow:hidden}.top{top:0}.bottom{bottom:0}
  .ph{position:absolute;inset:0;transform:scale(1.02)}.p1{background:#8f9aa8}.p2{background:#b58b9c}.p3{background:#7f9e99}.p4{background:#b9a99b}
  .ph::after{content:attr(data-label);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:800 15px/1 "Consolas",monospace;letter-spacing:.14em;color:rgba(255,255,255,.55)}
  .top .ph::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,14,.35),transparent 40%)}
  .bottom .ph::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,10,14,.5),transparent 45%)}
  .divider{position:absolute;left:-10%;right:-10%;top:50%;height:3px;background:#fff;transform:rotate(-3.5deg);z-index:3;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .copy{position:absolute;left:84px;right:84px;bottom:150px;z-index:5}.kicker{font:800 16px/1 "Consolas",monospace;letter-spacing:.2em;color:#ffd08a;margin-bottom:18px}
  h1{font-size:92px;line-height:1.03;font-weight:900;letter-spacing:-.055em}h1 em{font-style:normal;color:#ffd08a}.lead{margin-top:20px;font-size:27px;line-height:1.6;color:rgba(255,255,255,.7);max-width:780px}
  .hud{position:absolute;left:84px;right:84px;bottom:58px;z-index:8;display:flex;align-items:center;gap:18px;font:800 13px/1 "Consolas",monospace;letter-spacing:.13em;color:rgba(255,255,255,.5)}.hud .bar{flex:1;height:3px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden}.hud .bar i{display:block;height:100%;width:0;background:#ffd08a}
</style>
</head>
<body><div id="stage">
<section class="half top"><div class="ph p1" data-label="图片占位 01"></div></section>
<section class="half bottom"><div class="ph p2" data-label="图片占位 02"></div></section>
<div class="divider"></div>
<div class="copy"><div class="kicker" id="kicker">PHOTO SPLIT / 01</div><h1 id="title">上下两张图<br><em>讲一个对比</em></h1><div class="lead" id="lead">让两张图片各自承担一半信息，不用抢。</div></div>
<div class="hud"><span id="idx">01 / 04</span><div class="bar"><i id="bar"></i></div><span>10 SEC</span></div>
</div><script>
(function(){var FPS=30,DUR=10,$=function(s){return document.querySelector(s)};var data=[['上下两张图<br><em>讲一个对比</em>','让两张图片各自承担一半信息，不用抢。'],['上面是环境<br><em>下面是细节</em>','观众先看整体，再被一个细节抓住。'],['分屏不是<br><em>把画面切碎</em>','是让两张图产生关系。'],['最后让<br><em>一张图收住</em>','另一张退到背景，别平均用力。']];
function clamp(v){return Math.max(0,Math.min(1,v))}function cubicBezier(x1,y1,x2,y2){var cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;function fx(t){return((ax*t+bx)*t+cx)*t}function dfx(t){return(3*ax*t+2*bx)*t+cx}function fy(t){return((ay*t+by)*t+cy)*t}return function(v){v=clamp(v);var t=v;for(var i=0;i<6;i++){var x=fx(t)-v;if(Math.abs(x)<1e-5)break;var d=dfx(t);if(Math.abs(d)<1e-5)break;t=clamp(t-x/d)}return fy(t)}}var ease=cubicBezier(.16,1,.3,1);function smooth(v){return ease(v)}
window.renderFrame=function(frame,inputs){var t=Math.max(0,frame/FPS),active=Math.min(3,Math.floor(t/2.5));$('#kicker').textContent='PHOTO SPLIT / '+String(active+1).padStart(2,'0');$('#title').innerHTML=data[active][0];$('#lead').textContent=data[active][1];var local=t-active*2.5,e=smooth(local/.5);$('.top .ph').style.transform='scale('+(1.02+Math.min(1,local/2.5)*.05).toFixed(3)+')';$('.bottom .ph').style.transform='scale('+(1.02+Math.min(1,local/2.5)*.07).toFixed(3)+')';$('.copy').style.opacity=e.toFixed(3);$('.copy').style.transform='translateY('+((1-e)*16).toFixed(1)+'px)';$('#idx').textContent=String(active+1).padStart(2,'0')+' / 04';$('#bar').style.width=(t/DUR*100).toFixed(2)+'%'};window.renderFrame(0,{});window.__ready=true})();
</script></body></html>
